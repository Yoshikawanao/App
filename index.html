<style>
:root{--bg:#f6f9fd;--card:#fff;--tx:#15233f;--mut:#69768d;--bd:#e5ebf4;--ac:#2563eb;--ac-d:#1d4ed8;--ac-s:#eaf1ff;--ac2:#f59e0b;--gr:#0e9f6e;--gr-s:#e5f6ef;--am-s:#fff4df;--vi-s:#f0eaff;--rd:#dc2626;--sh:0 1px 2px rgba(21,35,63,.04),0 6px 18px rgba(37,99,235,.05);--shh:0 2px 4px rgba(21,35,63,.05),0 14px 30px rgba(37,99,235,.13);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 'Manrope',system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
main{max-width:1040px;margin:0 auto;padding:22px 24px 56px}
h2{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:6px 0 16px}
.hdr{display:flex;justify-content:flex-end;align-items:center;gap:12px;min-height:34px}
.hdr>div:first-child{display:none}body:not(.hn) .hdr{display:none}#who{display:flex;align-items:center;gap:12px;min-width:0}
.fl{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:12px}.fl>div{flex:1;max-width:280px}
.hi{color:var(--mut);font-weight:600;min-width:0;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.out,.lk{background:none;border:1px solid var(--bd);color:var(--tx);padding:7px 14px;border-radius:999px;cursor:pointer;font:inherit;font-weight:600;transition:all .18s}
.out:hover{border-color:var(--ac);color:var(--ac);background:var(--ac-s);transform:translateY(-1px)}
.lk{border:0;color:var(--ac);padding:2px 0;border-radius:6px}.lk:hover{color:var(--ac-d);text-decoration:underline}
.err{color:var(--rd);font-size:13px;min-height:18px;font-weight:600}
#nav{display:none}
body.hn{padding-left:224px}
body.hn #nav{display:flex;flex-direction:column;gap:4px;position:fixed;left:0;top:0;bottom:0;width:224px;padding:22px 14px;padding-top:calc(22px + env(safe-area-inset-top,0px));background:#e8ecf2;border-right:1px solid #d3dae5;z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.01em;margin:0 6px 22px;color:var(--tx)}
.bimg{display:inline-grid;place-items:center;flex:none;width:40px;height:40px;padding:4px;border-radius:12px;background:#fff;box-shadow:0 2px 8px rgba(21,35,63,.14)}.bimg img{width:100%;height:100%;object-fit:contain;display:block}
.logo{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:11px;background:var(--ac);color:#fff;font-size:13px;font-weight:800;box-shadow:0 4px 10px rgba(37,99,235,.3)}
.av{display:inline-grid;place-items:center;flex:none;width:40px;height:40px;border-radius:50%;overflow:hidden;background:var(--ac);color:#fff;font-weight:800;font-size:16px;line-height:1;user-select:none}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.lg{width:88px;height:88px;font-size:34px}
.tab{display:inline-flex;align-items:center;gap:8px}.tab .av{width:24px;height:24px;font-size:12px}.tab.on .av{box-shadow:0 0 0 2px rgba(255,255,255,.75)}
.hav{display:none}.hav .av{width:34px;height:34px;font-size:14px}
#nav a.prof{margin-top:auto;gap:11px;padding:10px;background:#fff;border:1px solid #d3dae5}
#nav a.prof:hover{background:var(--ac-s);border-color:#c7d8fa}
.pn{min-width:0;line-height:1.25}.pn b{display:block;color:var(--tx);font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pn small{display:block;color:var(--mut);font-size:12px;font-weight:600}
.pfr{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:12px}.pfb{display:flex;flex-direction:column;gap:10px;min-width:0}.pfa{display:flex;gap:10px;flex-wrap:wrap}.pfn{font-weight:800;font-size:17px;overflow-wrap:anywhere}
#nav a{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:12px;color:#475269;text-decoration:none;font-weight:600;transition:background .18s,color .18s,transform .18s}
#nav a span{display:inline-block;font-size:17px;transition:transform .2s}
#nav a:hover{background:#d5dce8;color:var(--tx);transform:translateX(3px)}#nav a:hover span{transform:scale(1.18)}
#nav a.on{background:#fff;color:var(--ac-d);font-weight:800;box-shadow:inset 3px 0 0 var(--ac),0 2px 8px rgba(21,35,63,.12)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tab{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 16px;border-radius:999px;cursor:pointer;font:inherit;font-weight:600;transition:all .18s}
.tab:hover{border-color:var(--ac);color:var(--ac-d);background:var(--ac-s);transform:translateY(-2px)}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac);box-shadow:0 5px 14px rgba(37,99,235,.3)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px 20px;box-shadow:var(--sh);transition:transform .22s,box-shadow .22s,border-color .22s}
.grid>.card:hover{transform:translateY(-4px);box-shadow:var(--shh);border-color:#c7d8fa}
.kp{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.kp>div:last-child{width:100%;min-width:0}
.kp .k{line-height:1.3}.kp .v{white-space:nowrap;font-size:clamp(20px,2vw,25px)}
.sb{font-size:12px;line-height:1.4;color:var(--mut);margin-top:3px;font-weight:500}
.ic{display:grid;place-items:center;flex:none;width:46px;height:46px;border-radius:14px;background:var(--ac-s);font-size:21px;transition:transform .25s}
.kp:hover .ic{transform:rotate(-8deg) scale(1.1)}
.grid>.kp:nth-child(4n+2) .ic{background:var(--gr-s)}.grid>.kp:nth-child(4n+3) .ic{background:var(--am-s)}.grid>.kp:nth-child(4n+4) .ic{background:var(--vi-s)}
.k{color:var(--mut);font-size:13px;font-weight:600}.v{font-size:25px;font-weight:800;letter-spacing:-.02em;margin-top:1px}.g{color:var(--gr)}
.row{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:18px}
@media(max-width:760px){.row{grid-template-columns:1fr}}
.cv{position:relative;height:270px;margin-top:8px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;align-items:end}
label{font-size:12.5px;color:var(--mut);font-weight:600;display:block;margin-bottom:5px}
input,select{width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--bd);background:#fff;color:var(--tx);font:inherit;transition:border-color .18s,box-shadow .18s}
input:hover,select:hover{border-color:#c4d2ea}
input:focus,select:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 4px rgba(37,99,235,.13)}
.p{padding:11px 20px;border:0;border-radius:11px;background:var(--ac);color:#fff;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 3px 8px rgba(37,99,235,.28);transition:transform .15s,box-shadow .2s,background .2s}
.p:hover{background:var(--ac-d);transform:translateY(-2px);box-shadow:0 8px 18px rgba(37,99,235,.35)}
.p:active{transform:translateY(0) scale(.97);box-shadow:0 2px 5px rgba(37,99,235,.3)}
button:focus-visible,a:focus-visible{outline:3px solid rgba(37,99,235,.4);outline-offset:2px}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:12.5px;background:#f8fafd}
th:first-child{border-radius:10px 0 0 10px}th:last-child{border-radius:0 10px 10px 0}
tr:not(:first-child){transition:background .15s}tr:not(:first-child):hover{background:#f3f7ff}
tr:last-child td{border-bottom:0}
.x{min-width:30px;height:30px;padding:0 8px;border-radius:99px;background:none;border:0;color:var(--mut);cursor:pointer;font-size:17px;transition:all .15s}
.x:hover{background:#fee2e2;color:var(--rd);transform:scale(1.12)}
.lnk{color:var(--ac);font-weight:700;text-decoration:none}.lnk:hover{text-decoration:underline}
a.p{display:inline-block;margin-top:10px;text-decoration:none;color:#fff}

.bdg{display:inline-block;margin-left:4px;padding:1px 8px;border-radius:99px;background:var(--am-s);color:#8a5a00;font-size:11.5px;font-weight:700;white-space:nowrap}
.note{color:var(--mut);font-size:12.5px;margin-top:10px}
.bar{height:12px;border-radius:99px;background:var(--ac-s);overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;border-radius:99px;background:var(--ac);transition:width .8s ease}

.row>*,.grid>*,main>*{min-width:0}
.rt td:empty{display:none}
@media(max-width:720px){
.grid{grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}

.card{padding:14px;border-radius:16px}
.kp{gap:8px}
.ic{width:38px;height:38px;font-size:18px;border-radius:12px}
.v{font-size:19px}.kp .v{font-size:clamp(14px,4.2vw,19px)}.sb{font-size:11.5px}
.row{gap:10px;margin-bottom:14px}
.cv{height:230px!important}
.tabs{flex-wrap:nowrap;overflow-x:auto;margin:0 -14px 14px;padding:2px 14px 6px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{flex:none}
input,select{font-size:16px}
form{grid-template-columns:repeat(2,1fr)}form .p{grid-column:1/-1}
.fl{flex-direction:column;align-items:stretch}.fl>div{max-width:none}
.rt,.rt tbody,.rt tr,.rt td{display:block;width:100%}
.rt tr:first-child{display:none}
.rt tr{padding:10px 2px;border-bottom:1px solid var(--bd)}.rt tr:last-child{border-bottom:0}
.rt td{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;padding:3px 0;white-space:normal;text-align:right}
.rt td::before{content:attr(data-l);color:var(--mut);font-weight:600;font-size:12.5px;text-align:left}
.rt td:first-child{font-weight:800;font-size:15px;padding-bottom:5px}
.rt td:empty{display:none}
.card table:not(.rt) td{white-space:normal}
.login{margin:24px auto;padding:22px}.login form{grid-template-columns:1fr}
}
@media(hover:none){.grid>.card:hover,.tab:hover,.p:hover,#nav a:hover,.out:hover,.kp:hover .ic{transform:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  const l=list(tab),sc=['painel','aportes','caixinhas','projecao'].includes(pg);
  $('app').innerHTML=`<h2>${PAGES.find(p=>p[0]===pg)[2]}</h2>`+(sc?`<div class="tabs"><button class="tab ${tab==='geral'?'on':''}" data-t="geral">Geral</button>${ids.map(i=>`<button class="tab ${tab===i?'on':''}" data-t="${i}">${av(i)}${esc(who(i))}</button>`).join('')}</div>`:'')+({painel,aportes,caixinhas,projecao,metas,ajustes})[pg](l,ids);
  $('app').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;proj.c=proj.pct=proj.cdi=null;flt='';render()});
  $('app').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(b.dataset.arm){remove(b.dataset.d);return}b.dataset.arm='1';b.textContent='Remover?';b.style.color='#dc2626';b.style.fontSize='13px';setTimeout(()=>{if(b.isConnected){delete b.dataset.arm;b.textContent='\u00d7';b.style.color='';b.style.fontSize=''}},3000)});
  if(post)post();
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function draw(l,ids){
  charts.forEach(c=>c.destroy());charts=[];
  const css=getComputedStyle(document.documentElement),ac=css.getPropertyValue('--ac').trim(),ac2=css.getPropertyValue('--ac2').trim(),mut=css.getPropertyValue('--mut').trim(),bd=css.getPropertyValue('--bd').trim();
  const sc={x:{ticks:{color:mut},grid:{color:bd}},y:{ticks:{color:mut,callback:v=>'R$ '+v.toLocaleString('pt-BR')},grid:{color:bd}}};
  const ms=months(l);
  charts.push(new Chart($('c1'),{type:'line',data:{labels:ms.map(d=>d.toLocaleDateString('pt-BR',{month:'short',year:'2-digit'})),datasets:[{label:'Aportado',data:ms.map(d=>inv(l,d)),borderColor:ac2,backgroundColor:ac2,tension:.25,pointRadius:2},{label:'Valor bruto',data:ms.map(d=>cur(l,d)),borderColor:ac,backgroundColor:ac,tension:.25,pointRadius:2},{label:'Valor líquido',data:ms.map(d=>liqL(l,d)),borderColor:'#0e9f6e',backgroundColor:'#0e9f6e',tension:.25,pointRadius:2}]},options:{maintainAspectRatio:false,scales:sc,plugins:{legend:{labels:{color:mut}}}}}));
  let labels,aport,atual,liq;const now=new Date();
  if(tab==='geral'){labels=ids.map(who);aport=ids.map(i=>inv(wallets[i]?.aportes||[],now));atual=ids.map(i=>cur(wallets[i]?.aportes||[],now));liq=ids.map(i=>liqL(wallets[i]?.aportes||[],now))}
  else{const g={};l.forEach(a=>{const k=a.caixinha;g[k]=g[k]||[];g[k].push(a)});labels=Object.keys(g);aport=labels.map(k=>inv(g[k],now));atual=labels.map(k=>cur(g[k],now));liq=labels.map(k=>liqL(g[k],now))}
  charts.push(new Chart($('c2'),{type:'bar',data:{labels,datasets:[{label:'Aportado',data:aport,backgroundColor:ac2},{label:'Bruto',data:atual,backgroundColor:ac},{label:'Líquido',data:liq,backgroundColor:'#0e9f6e'}]},options:{maintainAspectRatio:false,scales:sc,plugins:{legend:{labels:{color:mut}}}}}));
}

async function save(){await setDoc(D('carteiras/'+me),{aportes:wallets[me]?.aportes||[]},{merge:true})}
async function add(e){e.preventDefault();const o=$('fc').selectedOptions[0],v=o.dataset.v;if(v&&$('fd').value>v){msg('Essa caixinha vence em '+fd(v)+'. Escolha uma data até o vencimento.');return}const a={id:Date.now().toString(36),data:$('fd').value,valor:+$('fv').value,caixinha:$('fc').value.trim(),pct:+o.dataset.p,...(v?{venc:v}:{})};wallets[me]={...wallets[me],aportes:[...(wallets[me]?.aportes||[]),a]};render();try{await save();msg('')}catch(x){msg('Não foi possível salvar. Verifique sua conexão e tente de novo.')}}
async function remove(id){wallets[me]={...wallets[me],aportes:(wallets[me]?.aportes||[]).filter(a=>a.id!==id)};render();try{await save();msg('')}catch(x){msg('Não foi possível remover. Tente de novo.')}}
function loginView(){
  let novo=false;
  const draw=()=>{$('app').innerHTML=`<div class="card login"><div class="lb"><span class="bimg"><img src="${LOGO}" alt=""></span><div><b>Finanças</b><span>${novo?'Crie sua conta para começar':'Entre para ver seus aportes'}</span></div></div><form id="lf">${novo?'<div><label>Como você quer ser chamado?</label><input id="ln" required maxlength="40" placeholder="Ex.: Rei Chiquita" autocomplete="nickname"></div>':''}<div><label>E-mail</label><input id="le" type="email" required autocomplete="email"></div><div><label>Senha</label><input id="lp" type="password" minlength="6" required autocomplete="${novo?'new-password':'current-password'}"></div><button class="p">${novo?'Criar conta':'Entrar'}</button><button type="button" class="lk" id="t1">${novo?'Já tenho conta':'Criar conta'}</button>${novo?'':'<button type="button" class="lk" id="t2">Esqueci a senha</button>'}</form></div>`;
    $('t1').onclick=()=>{novo=!novo;msg('');draw()};
    if($('t2'))$('t2').onclick=async()=>{const e=$('le').value;if(!e){msg('Digite seu e-mail primeiro.');return}try{await sendPasswordResetEmail(auth,e);msg('Enviamos um link para redefinir a senha.')}catch(x){msg('Não foi possível enviar o e-mail.')}};
    $('lf').onsubmit=async ev=>{ev.preventDefault();msg('');const e=$('le').value.trim(),p=$('lp').value;
      try{if(novo){const c=await createUserWithEmailAndPassword(auth,e,p);await setDoc(D('carteiras/'+c.user.uid),{nome:$('ln').value.trim(),email:e},{merge:true})}else await signInWithEmailAndPassword(auth,e,p)}
      catch(x){msg(({'auth/invalid-credential':'E-mail ou senha incorretos.','auth/email-already-in-use':'Este e-mail já tem conta. Use Entrar.','auth/weak-password':'A senha precisa ter pelo menos 6 caracteres.','auth/too-many-requests':'Muitas tentativas. Aguarde um pouco.'})[x.code]||'Não foi possível entrar. Tente de novo.')}}};
  draw();
}
onAuthStateChanged(auth,u=>{
  unsubs.forEach(f=>f());unsubs=[];document.body.classList.remove('hn');$('nav').innerHTML='';charts.forEach(c=>c.destroy());charts=[];wallets={};ready=false;
  if(!u){me=null;$('who').innerHTML='';loginView();return}
  me=u.uid;
  $('who').innerHTML='<div class="hav" id="hav"></div><span class="hi" id="hi"></span><button class="out" id="out">Sair</button>';$('out').onclick=()=>signOut(auth);
  unsubs.push(onSnapshot(D('config/geral'),s=>{if(s.exists()){cdi=s.data().cdi||cdi;metaC=s.data().metaC||0;if(!busy())render()}},()=>msg('Sem permissão para ler os dados. Confira as regras do Firestore.')));
  unsubs.push(onSnapshot(collection(db,'carteiras'),q=>{
    wallets={};names={};q.docs.forEach(d=>{wallets[d.id]=d.data();names[d.id]=d.data().nome||(d.data().email||'').split('@')[0]});ready=true;
    msg('');if(!busy())render();
  },()=>msg('Sem permissão para ler os dados. Confira as regras do Firestore.')));
  render();
});
</script>
