<style>

.grid>.kp:nth-child(4n+2) .ic{background:var(--gr-s)}.grid>.kp:nth-child(4n+3) .ic{background:var(--am-s)}.grid>.kp:nth-child(4n+4) .ic{background:var(--vi-s)}

.cv{position:relative;height:270px;margin-top:8px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;align-items:end}
label{font-size:12.5px;color:var(--mut);font-weight:600;display:block;margin-bottom:5px}

.p:active{transform:translateY(0) scale(.97);box-shadow:0 2px 5px rgba(37,99,235,.3)}
button:focus-visible,a:focus-visible{outline:3px solid rgba(37,99,235,.4);outline-offset:2px}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}

tr:not(:first-child){transition:background .15s}tr:not(:first-child):hover{background:#f3f7ff}
tr:last-child td{border-bottom:0}
.x{min-width:30px;height:30px;padding:0 8px;border-radius:99px;background:none;border:0;color:var(--mut);cursor:pointer;font-size:17px;transition:all .15s}
.x:hover{background:#fee2e2;color:var(--rd);transform:scale(1.12)}
.lnk{color:var(--ac);font-weight:700;text-decoration:none}.lnk:hover{text-decoration:underline}
a.p{display:inline-block;margin-top:10px;text-decoration:none;color:#fff}
.cxl{margin-top:12px}.cxi{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--bd)}.cxi b{flex:1;min-width:0;overflow-wrap:anywhere}.cxi label{display:flex;align-items:center;gap:8px;margin:0}.cxi input{width:88px}
.note{color:var(--mut);font-size:12.5px;margin-top:10px}
.bar{height:12px;border-radius:99px;background:var(--ac-s);overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;border-radius:99px;background:var(--ac);transition:width .8s ease}
.login{max-width:410px;margin:56px auto;padding:28px}.login form{display:grid;grid-template-columns:1fr;gap:12px}
.lb{display:flex;align-items:center;gap:12px;margin-bottom:20px}.lb b{display:block;font-size:19px;font-weight:800}.lb span:not(.logo){color:var(--mut);font-size:13.5px}
.lb .logo{width:44px;height:44px;font-size:15px}
@media(max-width:720px){main{padding:16px 14px 40px}body.hn{padding-left:0;padding-bottom:78px}body.hn #nav{top:auto;width:auto;right:0;flex-direction:row;justify-content:space-around;gap:0;border-right:0;border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(21,35,63,.06)}.brand{display:none}#nav a{flex-direction:column;gap:0;font-size:11px;padding:5px 7px}#nav a:hover{transform:none}#nav a.on{box-shadow:inset 0 3px 0 var(--ac)}h2{font-size:22px}.hi{max-width:38vw}.hav{display:block}#nav a.prof{display:none}}
.row>*,.grid>*,main>*{min-width:0}
.rt td:empty{display:none}
@media(max-width:720px){
.grid{grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.grid>.card:last-child:nth-child(odd){grid-column:1/-1}
.card{padding:14px;border-radius:16px}
.kp{gap:8px}
.ic{width:38px;height:38px;font-size:18px;border-radius:12px}
.v{font-size:19px}.kp .v{font-size:clamp(14px,4.2vw,19px)}.sb{font-size:11.5px}
.row{gap:10px;margin-bottom:14px}
.cv{height:230px!important}
.tabs{flex-wrap:nowrap;overflow-x:auto;margin:0 -14px 14px;padding:2px 14px 6px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{flex:none}
input,select{font-size:16px}
form{grid-template-columns:repeat(2,1fr)}form .p{grid-column:1/-1}
.fl{flex-direction:column;align-items:stretch}.fl>div{max-width:none}
.rt,.rt tbody,.rt tr,.rt td{display:block;width:100%}
.rt tr:first-child{display:none}

.rt td:first-child{font-weight:800;font-size:15px;padding-bottom:5px}
.rt td:empty{display:none}
.card table:not(.rt) td{white-space:normal}
.login{margin:24px auto;padding:22px}.login form{grid-template-columns:1fr}
}
@media(hover:none){.grid>.card:hover,.tab:hover,.p:hover,#nav a:hover,.out:hover,.kp:hover .ic{transform:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<nav id="nav"></nav>
<main>
<div class="hdr"><div><h1>Meus aportes</h1><p class="sub">Cada pessoa registra os próprios aportes; o painel Geral soma tudo.</p></div><div id="who"></div></div>
<div class="err" id="msg"></div>
<div id="app"><div class="card">Carregando…</div></div>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,onSnapshot,setDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {firebaseConfig} from "./firebase-config.js";
const $=id=>document.getElementById(id);
function msg(t){$('msg').textContent=t||''}
if(String(firebaseConfig.apiKey).startsWith('COLE')){$('app').innerHTML='<div class="card">Falta configurar o Firebase. Siga o passo a passo do README e preencha o arquivo firebase-config.js.</div>';throw new Error('config')}
const fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getFirestore(fb);
Chart.defaults.font.family="'Manrope',system-ui,sans-serif";Chart.defaults.elements.bar.borderRadius=6;
let unsubs=[];
const R=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
let me,ready=false,names={},wallets={},cdi=14.5,tab='geral',charts=[];
function val(a,t){const d=(t-new Date(a.data+'T00:00:00'))/864e5;if(d<0)return 0;const r=(cdi/100)*(a.pct/100);return a.valor*Math.pow(1+r,d/365)}
const inv=(l,t)=>l.reduce((s,a)=>s+(new Date(a.data+'T00:00:00')<=t?a.valor:0),0);
const cur=(l,t)=>l.reduce((s,a)=>s+val(a,t),0);
function list(sc){return sc==='geral'?Object.values(wallets).flatMap(w=>w.aportes||[]):(wallets[sc]?.aportes||[])}
function nm(id){let n=names[id];if(!n&&id===me&&ready){const u=auth.currentUser;n=u?(u.displayName||(u.email||'').split('@')[0]):''}return (n||'').trim()}
const first=id=>nm(id).split(/\s+/)[0]||'';
function who(id){return id===me?(first(id)?first(id)+' (você)':'Eu'):(names[id]||'Outra pessoa')}
function av(id,c){const f=wallets[id]?.foto,n=nm(id);return `<div class="av ${c||''}">${f?`<img src="${esc(f)}" alt="">`:esc((n.charAt(0)||'').toUpperCase())}</div>`}
const D=id=>doc(db,...id.split('/'));
function months(l){if(!l.length)return[];const ds=l.map(a=>new Date(a.data+'T00:00:00')).sort((a,b)=>a-b);const out=[];let d=new Date(ds[0].getFullYear(),ds[0].getMonth()+1,0,23);const now=new Date();while(d<now){out.push(new Date(d));d=new Date(d.getFullYear(),d.getMonth()+2,0,23)}out.push(now);return out}
const PAGES=[['painel','📊','Painel'],['aportes','➕','Aportes'],['caixinhas','🗂️','Caixinhas'],['projecao','📈','Projeção'],['metas','🎯','Metas'],['ajustes','⚙️','Ajustes']];
let pg=(location.hash||'#painel').slice(1),flt='',post=null,metaC=0,proj={c:null,anos:10,cdi:null,pct:null};
if(!PAGES.some(p=>p[0]===pg))pg='painel';
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(PAGES.some(p=>p[0]===h)){pg=h;render();scrollTo(0,0)}});
const P=v=>v.toFixed(2).replace('.',',')+'%';
const PAL=['#2563eb','#f59e0b','#10b981','#8b5cf6','#ec4899','#06b6d4','#84cc16','#f97316'];
const IOFT=[96,93,90,86,83,80,76,73,70,66,63,60,56,53,50,46,43,40,36,33,30,26,23,20,16,13,10,6,3,0];
function tx(d){d=Math.floor(d);const i=d<1||d>=30?0:IOFT[d-1]/100,q=d<=180?.225:d<=360?.2:d<=720?.175:.15;return{i,q,e:i+(1-i)*q}}
function imp(a,t){const Y=val(a,t)-a.valor;if(Y<=0)return{iof:0,ir:0};const x=tx((t-new Date(a.data+'T00:00:00'))/864e5),iof=Y*x.i;return{iof,ir:(Y-iof)*x.q}}
const liqA=(a,t)=>{const x=imp(a,t);return val(a,t)-x.iof-x.ir};
const liqL=(l,t)=>l.reduce((s,a)=>s+liqA(a,t),0);
const impT=(l,t)=>l.reduce((s,a)=>{const x=imp(a,t);s.iof+=x.iof;s.ir+=x.ir;return s},{iof:0,ir:0});
function stats(l){const now=new Date(),s=new Date(now);s.setMonth(s.getMonth()-6);const rc=l.filter(a=>{const d=new Date(a.data+'T00:00:00');return d>s&&d<=now}),T=l.reduce((x,a)=>x+a.valor,0);return{V0:cur(l,now),A0:inv(l,now),c:Math.round(rc.reduce((x,a)=>x+a.valor,0)/6*100)/100,w:T?Math.round(l.reduce((x,a)=>x+a.valor*a.pct,0)/T*10)/10:100}}
const mrate=(cd,pc)=>Math.pow(1+Math.max(cd,0)/100*pc/100,1/12)-1;
function serie(V0,c,cd,pc,N){const r=mrate(cd,pc),o=[V0];for(let m=1;m<=N;m++)o.push(o[m-1]*(1+r)+c);return o}
function eta(V0,c,T,pc){if(V0>=T)return 0;const r=mrate(cdi,pc);let v=V0;for(let m=1;m<=600;m++){v=v*(1+r)+c;if(v>=T)return m}return null}
const dt=m=>{const d=new Date();d.setMonth(d.getMonth()+m);return d};
function dur(m){const a=Math.floor(m/12),b=m%12;return [a?a+(a>1?' anos':' ano'):'',b?b+(b>1?' meses':' mês'):''].filter(Boolean).join(' e ')}
function etaTxt(m,n){if(m===null)return'Não atinge a meta em 50 anos nesse ritmo.';if(m===0)return n?'Meta atingida, '+esc(n)+'!':'Meta atingida!';return'Previsão: '+dt(m).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})+' (em '+dur(m)+').'}
function rowsOf(ids){return (tab==='geral'?ids.flatMap(i=>(wallets[i]?.aportes||[]).map(a=>({...a,o:i}))):(wallets[tab]?.aportes||[]).map(a=>({...a,o:tab}))).sort((a,b)=>b.data.localeCompare(a.data))}
function card(k,v,g,i,sb){const t=`<div><div class="k">${k}</div><div class="v ${g?'g':''}">${v}</div>${sb?`<div class="sb">${sb}</div>`:''}</div>`;return i?`<div class="card kp"><span class="ic">${i}</span>${t}</div>`:`<div class="card">${t}</div>`}
function kpis(l){const now=new Date(),t=inv(l,now),a=cur(l,now),r=a-t,tx_=impT(l,now),ln=a-tx_.iof-tx_.ir,rl=ln-t;return `<div class="grid">${card('Total aportado',R(t),0,'💼')+card('Valor bruto estimado',R(a),0,'💰','Sem descontar impostos')+card('Valor líquido estimado',R(ln),0,'🏦','Após IOF e IR')+card('Rendimento bruto',R(r),1,'📈',P(t?r/t*100:0)+' sobre o aportado')+card('Rendimento líquido',R(rl),1,'✅',P(t?rl/t*100:0)+' sobre o aportado')+card('Impostos estimados',R(tx_.iof+tx_.ir),0,'🧾','IR '+R(tx_.ir)+' e IOF '+R(tx_.iof))}</div><div class="note" style="margin:-6px 0 16px">Líquido é o valor se você resgatasse tudo hoje, descontando o IOF (resgates com menos de 30 dias) e o IR regressivo (22,5% a 15%) sobre o rendimento de cada aporte, conforme o tempo de cada um. Vale para CDB/RDB; caixinhas isentas, como LCI/LCA, não seguem esse cálculo.</div>`}
function table(rows,del){const now=new Date(),g=tab==='geral';return `<table class="rt"><tr><th>Data</th>${g?'<th>Pessoa</th>':''}<th>Caixinha</th><th>Aporte</th><th>% CDI</th><th>Bruto hoje</th><th>Líquido hoje</th>${del?'<th></th>':''}</tr>`+(rows.map(a=>`<tr><td data-l="Data">${a.data.split('-').reverse().join('/')}</td>${g?`<td data-l="Pessoa">${esc(who(a.o))}</td>`:''}<td data-l="Caixinha">${esc(a.caixinha)}</td><td data-l="Aporte">${R(a.valor)}</td><td data-l="% do CDI">${a.pct}%</td><td data-l="Bruto hoje">${R(val(a,now))}</td><td data-l="Líquido hoje">${R(liqA(a,now))}</td>${del?`<td data-l="">${a.o===me?`<button class="x" data-d="${a.id}" title="Remover">×</button>`:''}</td>`:''}</tr>`).join('')||'<tr><td colspan="7" style="color:var(--mut)">Nenhum aporte ainda.</td></tr>')+'</table>'}
function painel(l,ids){

  let labels,aport,atual,liq;const now=new Date();
  if(tab==='geral'){labels=ids.map(who);aport=ids.map(i=>inv(wallets[i]?.aportes||[],now));atual=ids.map(i=>cur(wallets[i]?.aportes||[],now));liq=ids.map(i=>liqL(wallets[i]?.aportes||[],now))}
  else{const g={};l.forEach(a=>{const k=a.caixinha;g[k]=g[k]||[];g[k].push(a)});labels=Object.keys(g);aport=labels.map(k=>inv(g[k],now));atual=labels.map(k=>cur(g[k],now));liq=labels.map(k=>liqL(g[k],now))}
  charts.push(new Chart($('c2'),{type:'bar',data:{labels,datasets:[{label:'Aportado',data:aport,backgroundColor:ac2},{label:'Bruto',data:atual,backgroundColor:ac},{label:'Líquido',data:liq,backgroundColor:'#0e9f6e'}]},options:{maintainAspectRatio:false,scales:sc,plugins:{legend:{labels:{color:mut}}}}}));
}

async function save(){await setDoc(D('carteiras/'+me),{aportes:wallets[me]?.aportes||[]},{merge:true})}
async function add(e){e.preventDefault();const a={id:Date.now().toString(36),data:$('fd').value,valor:+$('fv').value,caixinha:$('fc').value.trim(),pct:+$('fc').selectedOptions[0].dataset.p};wallets[me]={...wallets[me],aportes:[...(wallets[me]?.aportes||[]),a]};render();try{await save();msg('')}catch(x){msg('Não foi possível salvar. Verifique sua conexão e tente de novo.')}}
async function remove(id){wallets[me]={...wallets[me],aportes:(wallets[me]?.aportes||[]).filter(a=>a.id!==id)};render();try{await save();msg('')}catch(x){msg('Não foi possível remover. Tente de novo.')}}
function loginView(){
  let novo=false;
  const draw=()=>{$('app').innerHTML=`<div class="card login"><div class="lb"><span class="logo">R$</span><div><b>Meus aportes</b><span>${novo?'Crie sua conta para começar':'Entre para ver seus aportes'}</span></div></div><form id="lf">${novo?'<div><label>Como você quer ser chamado?</label><input id="ln" required maxlength="40" placeholder="Ex.: Rei Chiquita" autocomplete="nickname"></div>':''}<div><label>E-mail</label><input id="le" type="email" required autocomplete="email"></div><div><label>Senha</label><input id="lp" type="password" minlength="6" required autocomplete="${novo?'new-password':'current-password'}"></div><button class="p">${novo?'Criar conta':'Entrar'}</button><button type="button" class="lk" id="t1">${novo?'Já tenho conta':'Criar conta'}</button>${novo?'':'<button type="button" class="lk" id="t2">Esqueci a senha</button>'}</form></div>`;
    $('t1').onclick=()=>{novo=!novo;msg('');draw()};
    if($('t2'))$('t2').onclick=async()=>{const e=$('le').value;if(!e){msg('Digite seu e-mail primeiro.');return}try{await sendPasswordResetEmail(auth,e);msg('Enviamos um link para redefinir a senha.')}catch(x){msg('Não foi possível enviar o e-mail.')}};
    $('lf').onsubmit=async ev=>{ev.preventDefault();msg('');const e=$('le').value.trim(),p=$('lp').value;
      try{if(novo){const c=await createUserWithEmailAndPassword(auth,e,p);await setDoc(D('carteiras/'+c.user.uid),{nome:$('ln').value.trim(),email:e},{merge:true})}else await signInWithEmailAndPassword(auth,e,p)}
      catch(x){msg(({'auth/invalid-credential':'E-mail ou senha incorretos.','auth/email-already-in-use':'Este e-mail já tem conta. Use Entrar.','auth/weak-password':'A senha precisa ter pelo menos 6 caracteres.','auth/too-many-requests':'Muitas tentativas. Aguarde um pouco.'})[x.code]||'Não foi possível entrar. Tente de novo.')}}};
  draw();
}
onAuthStateChanged(auth,u=>{
  unsubs.forEach(f=>f());unsubs=[];document.body.classList.remove('hn');$('nav').innerHTML='';charts.forEach(c=>c.destroy());charts=[];wallets={};ready=false;
  if(!u){me=null;$('who').innerHTML='';loginView();return}
  me=u.uid;
  $('who').innerHTML='<div class="hav" id="hav"></div><span class="hi" id="hi"></span><button class="out" id="out">Sair</button>';$('out').onclick=()=>signOut(auth);
  unsubs.push(onSnapshot(D('config/geral'),s=>{if(s.exists()){cdi=s.data().cdi||cdi;metaC=s.data().metaC||0;if(!document.activeElement||document.activeElement.id!=='cdi')render()}},()=>msg('Sem permissão para ler os dados. Confira as regras do Firestore.')));
  unsubs.push(onSnapshot(collection(db,'carteiras'),q=>{
    wallets={};names={};q.docs.forEach(d=>{wallets[d.id]=d.data();names[d.id]=d.data().nome||(d.data().email||'').split('@')[0]});ready=true;
    msg('');if(!document.activeElement||document.activeElement.id!=='fnm')render();
  },()=>msg('Sem permissão para ler os dados. Confira as regras do Firestore.')));
  render();
});
</script>
