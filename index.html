<body>
<nav id="nav"></nav>
<main>
<div class="top"><div><h1>Meus aportes</h1><p class="sub">Cada pessoa registra os próprios aportes; o painel Geral soma tudo.</p></div><div id="who"></div></div>
<div class="err" id="msg"></div>
<div id="app"><div class="card">Carregando…</div></div>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

const fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getFirestore(fb);
Chart.defaults.font.family="'Manrope',system-ui,sans-serif";Chart.defaults.elements.bar.borderRadius=6;
let unsubs=[];
const R=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});

const inv=(l,t)=>l.reduce((s,a)=>s+(new Date(a.data+'T00:00:00')<=t?a.valor:0),0);
const cur=(l,t)=>l.reduce((s,a)=>s+val(a,t),0);
function list(sc){return sc==='geral'?Object.values(wallets).flatMap(w=>w.aportes||[]):(wallets[sc]?.aportes||[])}

const D=id=>doc(db,...id.split('/'));
function months(l){if(!l.length)return[];const ds=l.map(a=>new Date(a.data+'T00:00:00')).sort((a,b)=>a-b);const out=[];let d=new Date(ds[0].getFullYear(),ds[0].getMonth()+1,0,23);const now=new Date();while(d<now){out.push(new Date(d));d=new Date(d.getFullYear(),d.getMonth()+2,0,23)}out.push(now);return out}
const PAGES=[['painel','📊','Painel'],['aportes','➕','Aportes'],['caixinhas','🗂️','Caixinhas'],['projecao','📈','Projeção'],['metas','🎯','Metas'],['ajustes','⚙️','Ajustes']];
let pg=(location.hash||'#painel').slice(1),flt='',post=null,metaC=0,proj={c:null,anos:10,cdi:null,pct:null};
if(!PAGES.some(p=>p[0]===pg))pg='painel';
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(PAGES.some(p=>p[0]===h)){pg=h;render();scrollTo(0,0)}});
const P=v=>v.toFixed(2).replace('.',',')+'%';
const PAL=['#2563eb','#f59e0b','#10b981','#8b5cf6','#ec4899','#06b6d4','#84cc16','#f97316'];
function stats(l){const now=new Date(),s=new Date(now);s.setMonth(s.getMonth()-6);const rc=l.filter(a=>{const d=new Date(a.data+'T00:00:00');return d>s&&d<=now}),T=l.reduce((x,a)=>x+a.valor,0);return{V0:cur(l,now),A0:inv(l,now),c:Math.round(rc.reduce((x,a)=>x+a.valor,0)/6*100)/100,w:T?Math.round(l.reduce((x,a)=>x+a.valor*a.pct,0)/T*10)/10:100}}
const mrate=(cd,pc)=>Math.pow(1+Math.max(cd,0)/100*pc/100,1/12)-1;
function serie(V0,c,cd,pc,N){const r=mrate(cd,pc),o=[V0];for(let m=1;m<=N;m++)o.push(o[m-1]*(1+r)+c);return o}

const dt=m=>{const d=new Date();d.setMonth(d.getMonth()+m);return d};
function dur(m){const a=Math.floor(m/12),b=m%12;return [a?a+(a>1?' anos':' ano'):'',b?b+(b>1?' meses':' mês'):''].filter(Boolean).join(' e ')}
function etaTxt(m){if(m===null)return'Não atinge a meta em 50 anos nesse ritmo.';if(m===0)return'Meta atingida!';return'Previsão: '+dt(m).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})+' (em '+dur(m)+').'}
function rowsOf(ids){return (tab==='geral'?ids.flatMap(i=>(wallets[i]?.aportes||[]).map(a=>({...a,o:i}))):(wallets[tab]?.aportes||[]).map(a=>({...a,o:tab}))).sort((a,b)=>b.data.localeCompare(a.data))}
function card(k,v,g,i){const t=`<div><div class="k">${k}</div><div class="v ${g?'g':''}">${v}</div></div>`;return i?`<div class="card kp"><span class="ic">${i}</span>${t}</div>`:`<div class="card">${t}</div>`}
function kpis(l){const now=new Date(),t=inv(l,now),a=cur(l,now),r=a-t;return `<div class="grid">${card('Total aportado',R(t),0,'💼')+card('Valor atual estimado',R(a),0,'💰')+card('Rendimento estimado',R(r),1,'📈')+card('Rentabilidade',P(t?r/t*100:0),1,'✨')}</div>`}
function table(rows,del){const now=new Date(),g=tab==='geral';return `<table><tr><th>Data</th>${g?'<th>Pessoa</th>':''}<th>Caixinha</th><th>Aporte</th><th>% CDI</th><th>Hoje (est.)</th>${del?'<th></th>':''}</tr>`+(rows.map(a=>`<tr><td>${a.data.split('-').reverse().join('/')}</td>${g?`<td>${esc(who(a.o))}</td>`:''}<td>${esc(a.caixinha)}</td><td>${R(a.valor)}</td><td>${a.pct}%</td><td>${R(val(a,now))}</td>${del?`<td>${a.o===me?`<button class="x" data-d="${a.id}" title="Remover">×</button>`:''}</td>`:''}</tr>`).join('')||'<tr><td colspan="7" style="color:var(--mut)">Nenhum aporte ainda.</td></tr>')+'</table>'}
function painel(l,ids){
  post=()=>draw(l,ids);
  return kpis(l)+`<div class="row"><div class="card"><div class="k">Evolução: aportado × valor estimado</div><div class="cv"><canvas id="c1"></canvas></div></div><div class="card"><div class="k">${tab==='geral'?'Valor atual por pessoa':'Valor por caixinha'}</div><div class="cv"><canvas id="c2"></canvas></div></div></div><div class="card sc"><div class="k" style="margin-bottom:6px">Últimos aportes</div>${table(rowsOf(ids).slice(0,5),false)}</div>`}
function aportes(l,ids){
  const all=rowsOf(ids),cx=[...new Set(all.map(a=>a.caixinha))].sort();
  if(flt&&!cx.includes(flt))flt='';
  const rows=flt?all.filter(a=>a.caixinha===flt):all,tot=rows.reduce((s,a)=>s+a.valor,0);
  post=()=>{if($('f')){$('fd').value=(d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10))(new Date());$('f').onsubmit=add}
    $('fx').onchange=e=>{flt=e.target.value;render()};
    $('ex').onclick=()=>{const q=x=>'"'+String(x).replace(/"/g,'""')+'"',csv='Data;Pessoa;Caixinha;Aporte;% CDI\n'+rows.map(a=>[a.data,who(a.o),a.caixinha,String(a.valor).replace('.',','),a.pct].map(q).join(';')).join('\n'),u=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'})),k=document.createElement('a');k.href=u;k.download='aportes.csv';k.click();URL.revokeObjectURL(u)}};
  return (tab===me?`<div class="card" style="margin-bottom:16px"><form id="f"><div><label>Data</label><input type="date" id="fd" required></div><div><label>Valor (R$)</label><input type="number" id="fv" step="0.01" min="0.01" required></div><div><label>Caixinha</label><input id="fc" list="cxs" placeholder="Ex.: Reserva" required></div><div><label>% do CDI</label><input type="number" id="fp" step="0.1" min="1" value="100" required></div><button class="p">Adicionar aporte</button></form><datalist id="cxs">${cx.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div>`:'')+`<div class="card sc"><div class="top" style="margin-bottom:8px"><div><label>Filtrar por caixinha</label><select id="fx"><option value="">Todas</option>${cx.map(c=>`<option value="${esc(c)}" ${c===flt?'selected':''}>${esc(c)}</option>`).join('')}</select></div><button class="p" id="ex">Exportar CSV</button></div>${table(rows,true)}<div class="note">${rows.length} aporte(s) listado(s). Total aportado: ${R(tot)}.</div></div>`}
function caixinhas(l){
  const now=new Date(),g={};l.forEach(a=>(g[a.caixinha]=g[a.caixinha]||[]).push(a));
  const rs=Object.entries(g).map(([k,x])=>{const t=inv(x,now),c=cur(x,now),sv=x.reduce((s,a)=>s+a.valor,0);return{k,t,c,r:c-t,w:sv?x.reduce((s,a)=>s+a.valor*a.pct,0)/sv:0}}).sort((a,b)=>b.c-a.c),T=rs.reduce((s,r)=>s+r.c,0);
  post=()=>{if(!rs.length)return;charts.push(new Chart($('c3'),{type:'doughnut',data:{labels:rs.map(r=>r.k),datasets:[{data:rs.map(r=>r.c),backgroundColor:rs.map((r,i)=>PAL[i%PAL.length]),borderWidth:0}]},options:{maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:getComputedStyle(document.documentElement).getPropertyValue('--mut').trim()}}}}}))};

  return `<div class="row"><div class="card"><div class="k">Resumo por caixinha</div><div class="sc"><table><tr><th>Caixinha</th><th>Aportado</th><th>Atual (est.)</th><th>Rendimento</th><th>% CDI médio</th><th>Parte do total</th></tr>${rs.map(r=>`<tr><td>${esc(r.k)}</td><td>${R(r.t)}</td><td>${R(r.c)}</td><td class="g">${R(r.r)}</td><td>${r.w.toFixed(1).replace('.',',')}%</td><td>${P(T?r.c/T*100:0)}</td></tr>`).join('')}</table></div><div class="note">Caixinha que mais rendeu em reais: ${esc(top.k)} (${R(top.r)}). Concentração na maior caixinha: ${P(T?rs[0].c/T*100:0)} do total.</div></div><div class="card"><div class="k">Distribuição do valor atual</div><div class="cv"><canvas id="c3"></canvas></div></div></div>`}
function projecao(l){
  const S=stats(l),c=proj.c??S.c,N=proj.anos*12,cd=proj.cdi??cdi,pc=proj.pct??S.w;
  const big=serie(S.V0,c,cd,pc,600),b=big.slice(0,N+1),ot=serie(S.V0,c,cd+2,pc,N),pe=serie(S.V0,c,cd-2,pc,N),sn=serie(S.V0,0,cd,pc,N);

    const mut=getComputedStyle(document.documentElement).getPropertyValue('--mut').trim(),bd=getComputedStyle(document.documentElement).getPropertyValue('--bd').trim(),L=b.map((v,m)=>dt(m).toLocaleDateString('pt-BR',{month:'short',year:'2-digit'})),ds=(label,data,color,dash)=>({label,data,borderColor:color,backgroundColor:color,borderDash:dash||[],pointRadius:0,tension:.2,borderWidth:2});
    charts.push(new Chart($('c4'),{type:'line',data:{labels:L,datasets:[ds('Otimista (CDI +2 p.p.)',ot,'#16a34a'),ds('Base',b,PAL[0]),ds('Pessimista (CDI −2 p.p.)',pe,'#dc2626'),ds('Só o saldo atual, sem novos aportes',sn,mut,[6,4]),ds('Total aportado',b.map((v,m)=>ap(m)),PAL[1],[2,3])]},options:{maintainAspectRatio:false,interaction:{mode:'index',intersect:false},scales:{x:{ticks:{color:mut,maxTicksLimit:8},grid:{color:bd}},y:{ticks:{color:mut,callback:v=>'R$ '+v.toLocaleString('pt-BR')},grid:{color:bd}}},plugins:{legend:{labels:{color:mut}},tooltip:{callbacks:{label:x=>x.dataset.label+': '+R(x.parsed.y)}}}}}))};
  const yrs=Array.from({length:proj.anos},(_,i)=>(i+1)*12).filter(m=>m<=N);
  return `<div class="card" style="margin-bottom:16px"><form><div><label>Aporte mensal (R$)</label><input type="number" id="pa" step="0.01" min="0" value="${c}"></div><div><label>Horizonte</label><select id="py">${[1,2,3,5,10,15,20,30].map(y=>`<option value="${y}" ${y===proj.anos?'selected':''}>${y} ${y>1?'anos':'ano'}</option>`).join('')}</select></div><div><label>CDI esperado (% a.a.)</label><input type="number" id="pd" step="0.01" min="0" value="${cd}"></div><div><label>% do CDI</label><input type="number" id="pp" step="0.1" min="1" value="${pc}"></div></form><div class="note">Valores iniciais: aporte médio dos últimos 6 meses e % do CDI médio ponderado das suas caixinhas. Altere à vontade para simular.</div></div>`
  +`<div class="grid">${card('Valor em '+proj.anos+(proj.anos>1?' anos':' ano'),R(fim),0,'🏁')+card('Total aportado',R(aT),0,'💼')+card('Rendimento acumulado',R(j)+' <span class="k">('+P(fim?j/fim*100:0)+' do total)</span>',1,'📈')+card('Rendimento mensal no fim',R(fim*r),1,'💵')+card('Sem novos aportes',R(sn[N]),0,'🐢')}</div>`
  +`<div class="card" style="margin-bottom:16px"><div class="k">Projeção do patrimônio</div><div class="cv" style="height:320px"><canvas id="c4"></canvas></div></div>`
  +(ms.length?`<div class="card" style="margin-bottom:16px"><div class="k">Quando você chega lá (cenário base)</div><table>${ms.map(([M,m])=>`<tr><td>${R(M)}</td><td>${m<0?'Além de 50 anos':dt(m).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})+' (em '+dur(m)+')'}</td></tr>`).join('')}</table></div>`:'')
  +`<div class="card sc"><div class="k" style="margin-bottom:6px">Ano a ano (cenário base)</div><table><tr><th>Ano</th><th>Aportado</th><th>Valor</th><th>Rendimento</th><th>Rendimento mensal</th></tr>${yrs.map(m=>`<tr><td>${m/12}</td><td>${R(ap(m))}</td><td>${R(b[m])}</td><td class="g">${R(b[m]-ap(m))}</td><td>${R(b[m]*r)}</td></tr>`).join('')}</table><div class="note">Estimativa bruta: considera aportes no fim de cada mês, juros compostos e CDI constante, sem IR/IOF. Os cenários otimista e pessimista variam o CDI em 2 pontos percentuais. Não é garantia de rendimento.</div></div>`}
function metaBlock(titulo,l,T,id){const S=stats(l),p=T?Math.min(100,S.V0/T*100):0;return `<div class="card" style="margin-bottom:16px"><div class="k">${titulo}</div>${T?`<div class="v">${R(S.V0)} <span class="k">de ${R(T)}</span></div><div class="bar"><i style="width:${p}%"></i></div><div class="note">${P(p)} concluído. Faltam ${R(Math.max(0,T-S.V0))}. ${etaTxt(eta(S.V0,S.c,T,S.w))}</div><div class="note">Cálculo com aporte médio de ${R(S.c)} por mês (últimos 6 meses), ${S.w.toString().replace('.',',')}% do CDI e CDI de ${String(cdi).replace('.',',')}% a.a.</div>`:'<div class="note">Nenhuma meta definida.</div>'}<form id="${id}" style="margin-top:10px"><div><label>Valor da meta (R$)</label><input type="number" id="${id}v" step="0.01" min="0" value="${T||''}"></div><button class="p">Salvar meta</button></form></div>`}
function metas(){
  const mine=wallets[me]?.meta||0;
  post=()=>{const sv=(id,path,key,after)=>{$(id).onsubmit=async e=>{e.preventDefault();const v=+$(id+'v').value||0;after(v);render();try{await setDoc(D(path),{[key]:v},{merge:true});msg('')}catch(x){msg('Não foi possível salvar a meta.')}}};
    sv('m1','carteiras/'+me,'meta',v=>{wallets[me]={...wallets[me],meta:v}});sv('m2','config/geral','metaC',v=>{metaC=v})};
  return metaBlock('Minha meta',list(me),mine,'m1')+metaBlock('Meta conjunta (soma dos dois)',list('geral'),metaC,'m2')}
function ajustes(){
  post=()=>{$('fcdi').onsubmit=async e=>{e.preventDefault();cdi=+$('cdi').value;render();try{await setDoc(D('config/geral'),{cdi});msg('')}catch(x){msg('Não foi possível salvar o CDI.')}}};
  return `<div class="card"><form id="fcdi"><div><label>CDI anual (% a.a.)</label><input type="number" id="cdi" step="0.01" value="${cdi}"></div><button class="p">Atualizar CDI</button></form><div class="note">O CDI é compartilhado entre vocês dois e alimenta todas as estimativas. O rendimento é uma estimativa bruta (sem IR/IOF), com juros compostos por dias corridos sobre o CDI anual informado × % da caixinha.</div></div>`}
function render(){
  if(!me)return;
  document.body.classList.add('hn');post=null;
  $('nav').innerHTML='<div class="brand"><span class="logo">R$</span>Aportes</div>'+PAGES.map(p=>`<a href="#${p[0]}" class="${pg===p[0]?'on':''}"><span>${p[1]}</span>${p[2]}</a>`).join('');
  const ids=[...new Set([me,...Object.keys(wallets)])];
  if($('hi'))$('hi').textContent='Olá, '+(names[me]||'');
  if(tab!=='geral'&&!ids.includes(tab))tab='geral';
  charts.forEach(c=>c.destroy());charts=[];
  const l=list(tab),sc=['painel','aportes','caixinhas','projecao'].includes(pg);
  $('app').innerHTML=`<h2>${PAGES.find(p=>p[0]===pg)[2]}</h2>`+(sc?`<div class="tabs"><button class="tab ${tab==='geral'?'on':''}" data-t="geral">Geral</button>${ids.map(i=>`<button class="tab ${tab===i?'on':''}" data-t="${i}">${esc(who(i))}</button>`).join('')}</div>`:'')+({painel,aportes,caixinhas,projecao,metas,ajustes})[pg](l,ids);
  $('app').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;proj.c=proj.pct=proj.cdi=null;flt='';render()});
  $('app').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(b.dataset.arm){remove(b.dataset.d);return}b.dataset.arm='1';b.textContent='Remover?';b.style.color='#dc2626';b.style.fontSize='13px';setTimeout(()=>{if(b.isConnected){delete b.dataset.arm;b.textContent='\u00d7';b.style.color='';b.style.fontSize=''}},3000)});
  if(post)post();
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function draw(l,ids){
  charts.forEach(c=>c.destroy());charts=[];
  const css=getComputedStyle(document.documentElement),ac=css.getPropertyValue('--ac').trim(),ac2=css.getPropertyValue('--ac2').trim(),mut=css.getPropertyValue('--mut').trim(),bd=css.getPropertyValue('--bd').trim();
  const sc={x:{ticks:{color:mut},grid:{color:bd}},y:{ticks:{color:mut,callback:v=>'R$ '+v.toLocaleString('pt-BR')},grid:{color:bd}}};
  const ms=months(l);
  charts.push(new Chart($('c1'),{type:'line',data:{labels:ms.map(d=>d.toLocaleDateString('pt-BR',{month:'short',year:'2-digit'})),datasets:[{label:'Aportado',data:ms.map(d=>inv(l,d)),borderColor:ac2,backgroundColor:ac2,tension:.25,pointRadius:2},{label:'Valor estimado',data:ms.map(d=>cur(l,d)),borderColor:ac,backgroundColor:ac,tension:.25,pointRadius:2}]},options:{maintainAspectRatio:false,scales:sc,plugins:{legend:{labels:{color:mut}}}}}));
  let labels,aport,atual;const now=new Date();
  if(tab==='geral'){labels=ids.map(who);aport=ids.map(i=>inv(wallets[i]?.aportes||[],now));atual=ids.map(i=>cur(wallets[i]?.aportes||[],now))}
  else{const g={};l.forEach(a=>{const k=a.caixinha;g[k]=g[k]||[];g[k].push(a)});labels=Object.keys(g);aport=labels.map(k=>inv(g[k],now));atual=labels.map(k=>cur(g[k],now))}
  charts.push(new Chart($('c2'),{type:'bar',data:{labels,datasets:[{label:'Aportado',data:aport,backgroundColor:ac2},{label:'Atual',data:atual,backgroundColor:ac}]},options:{maintainAspectRatio:false,scales:sc,plugins:{legend:{labels:{color:mut}}}}}));
}

async function save(){await setDoc(D('carteiras/'+me),{aportes:wallets[me]?.aportes||[]},{merge:true})}
async function add(e){e.preventDefault();const a={id:Date.now().toString(36),data:$('fd').value,valor:+$('fv').value,caixinha:$('fc').value.trim(),pct:+$('fp').value};wallets[me]={...wallets[me],aportes:[...(wallets[me]?.aportes||[]),a]};render();try{await save();msg('')}catch(x){msg('Não foi possível salvar. Verifique sua conexão e tente de novo.')}}
async function remove(id){wallets[me]={...wallets[me],aportes:(wallets[me]?.aportes||[]).filter(a=>a.id!==id)};render();try{await save();msg('')}catch(x){msg('Não foi possível remover. Tente de novo.')}}
function loginView(){
  let novo=false;
  const draw=()=>{$('app').innerHTML=`<div class="card login"><div class="lb"><span class="logo">R$</span><div><b>Meus aportes</b><span>${novo?'Crie sua conta para começar':'Entre para ver seus aportes'}</span></div></div><form id="lf">${novo?'<div><label>Seu nome</label><input id="ln" required autocomplete="name"></div>':''}<div><label>E-mail</label><input id="le" type="email" required autocomplete="email"></div><div><label>Senha</label><input id="lp" type="password" minlength="6" required autocomplete="${novo?'new-password':'current-password'}"></div><button class="p">${novo?'Criar conta':'Entrar'}</button><button type="button" class="lk" id="t1">${novo?'Já tenho conta':'Criar conta'}</button>${novo?'':'<button type="button" class="lk" id="t2">Esqueci a senha</button>'}</form></div>`;
    $('t1').onclick=()=>{novo=!novo;msg('');draw()};
    if($('t2'))$('t2').onclick=async()=>{const e=$('le').value;if(!e){msg('Digite seu e-mail primeiro.');return}try{await sendPasswordResetEmail(auth,e);msg('Enviamos um link para redefinir a senha.')}catch(x){msg('Não foi possível enviar o e-mail.')}};
    $('lf').onsubmit=async ev=>{ev.preventDefault();msg('');const e=$('le').value.trim(),p=$('lp').value;
      try{if(novo){const c=await createUserWithEmailAndPassword(auth,e,p);await setDoc(D('carteiras/'+c.user.uid),{nome:$('ln').value.trim(),email:e},{merge:true})}else await signInWithEmailAndPassword(auth,e,p)}
      catch(x){msg(({'auth/invalid-credential':'E-mail ou senha incorretos.','auth/email-already-in-use':'Este e-mail já tem conta. Use Entrar.','auth/weak-password':'A senha precisa ter pelo menos 6 caracteres.','auth/too-many-requests':'Muitas tentativas. Aguarde um pouco.'})[x.code]||'Não foi possível entrar. Tente de novo.')}}};
  draw();
}
onAuthStateChanged(auth,u=>{
  unsubs.forEach(f=>f());unsubs=[];document.body.classList.remove('hn');$('nav').innerHTML='';charts.forEach(c=>c.destroy());charts=[];wallets={};
  if(!u){me=null;$('who').innerHTML='';loginView();return}
  me=u.uid;
  $('who').innerHTML='<span class="hi" id="hi"></span><button class="out" id="out">Sair</button>';$('out').onclick=()=>signOut(auth);
  unsubs.push(onSnapshot(D('config/geral'),s=>{if(s.exists()){cdi=s.data().cdi||cdi;metaC=s.data().metaC||0;if(!document.activeElement||document.activeElement.id!=='cdi')render()}},()=>msg('Sem permissão para ler os dados. Confira as regras do Firestore.')));
  unsubs.push(onSnapshot(collection(db,'carteiras'),q=>{
    wallets={};names={};q.docs.forEach(d=>{wallets[d.id]=d.data();names[d.id]=d.data().nome||(d.data().email||'').split('@')[0]});
    msg('');render();
  },()=>msg('Sem permissão para ler os dados. Confira as regras do Firestore.')));
  render();
});
</script>
</body>
</html>
